name: Python checks

on:
  push:
    branches: [main, feature/multi-agent-supervisor]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas python-dotenv
      - name: Compile application
        run: python -m compileall -q spendsmart_agent.py
      - name: Run finance-tool tests
        run: python -m unittest discover -s tests -v
